# Copy or generate with: pnpm fdt ci template --out .github/workflows/fdt-workspace-ci.yml --workspace ./
name: FDT Workspace CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  fdt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run FDT CI pipeline
        run: >
          pnpm fdt ci run
          --workspace ./
          --ci
          --gates validate,security,qa
          --report-only validate

      - name: Upload CI pipeline report
        if: always() && hashFiles('./.fdt/reports/ci-pipeline.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fdt-ci-pipeline
          path: ./.fdt/reports/ci-pipeline.json

      - name: Upload security SARIF
        if: always() && hashFiles('./.fdt/reports/security-audit.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ./.fdt/reports/security-audit.sarif.json
          category: fdt-security
